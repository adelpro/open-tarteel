name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack # ← MUST be first, before setup-node
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # ← now works because corepack is already enabled

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
